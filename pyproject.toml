[project]
name = "project-metric-contract"
version = "0.0.0"
description = "Generated Python bindings of the project contract; install from Git by reviewed commit SHA."
requires-python = ">=3.12"
dependencies = ["msgspec>=0.19"]

[dependency-groups]
dev = ["datamodel-code-generator==0.83.0"]

[build-system]
requires = ["uv_build>=0.7,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "project_metric_contract"
module-root = "python"
